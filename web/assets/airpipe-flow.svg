<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,monospace" role="img" aria-label="AirPipe: the sender runs airpipe send and gets a passphrase; the receiver types it. Both reach the relay only to swap an encrypted WebRTC offer and answer, then the file streams directly between them, encrypted end to end. The relay never gets the key, and if a direct path fails it forwards ciphertext only.">
  <style>
    text { font-size: 13px; }
    .dim { fill: #8D8477; }
    .ink { fill: #ECE6DC; }
    .acc { fill: #FF4F00; }
    .ok  { fill: #6FBF73; }
    .lbl { font-size: 10px; letter-spacing: 1.5px; font-weight: 700; }
    .sm  { font-size: 11px; }
    .fillbox { transform-box: fill-box; transform-origin: left center; }
    .ctr { transform-box: fill-box; transform-origin: center; }

    /* one shared 14s clock: typing, handshake and transfer stay in step.
       Packets loop at 1s (14 per cycle) so they stay in phase too. */
    .a11,.a14,.a18,.a22,.a26,.a38,.a40,.a43,.a46,.a48,.a61,.a64,.a87,.a89,
    .prog,.sigS,.sigR,.relay,.d1,.d2,.dline,.pipe,.lock { animation-duration: 14s; animation-timing-function: linear; animation-iteration-count: infinite; }

    /* steps() = one monospace char per tick */
    .type-s { animation: typeS 14s steps(24,end) infinite; }
    .type-r { animation: typeR 14s steps(42,end) infinite; }
    .caret  { animation: blink 1.06s steps(1,end) infinite; }
    .pkt    { animation: flow 1s linear infinite; }

    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes typeS { 0%,2% { transform: scaleX(0) } 9%,100% { transform: scaleX(1) } }
    @keyframes typeR { 0%,29% { transform: scaleX(0) } 37%,100% { transform: scaleX(1) } }

    /* sender reaches the relay while it waits; receiver when it opens direct */
    .sigS { animation-name: sigS } @keyframes sigS { 0%,25.9% {opacity:0} 27%,61% {opacity:1} 65%,96% {opacity:.14} 100% {opacity:0} }
    .sigR { animation-name: sigR } @keyframes sigR { 0%,45.9% {opacity:0} 47%,61% {opacity:1} 65%,96% {opacity:.14} 100% {opacity:0} }
    .relay { animation-name: relay } @keyframes relay { 0%,25.9% {stroke:rgba(236,230,220,.12)} 27%,61% {stroke:#FF4F00} 65%,100% {stroke:rgba(236,230,220,.12)} }
    /* offer: sender -> relay -> receiver; answer: back. Both encrypted. */
    .d1 { animation-name: d1 } @keyframes d1 { 0%,48.9% {opacity:0; transform:translate(0,0)} 49% {opacity:1; transform:translate(0,0)} 51% {transform:translate(75px,-58px)} 53% {transform:translate(185px,-58px)} 54.5% {transform:translate(260px,0)} 54.5% {opacity:1} 54.6%,100% {opacity:0} }
    .d2 { animation-name: d2 } @keyframes d2 { 0%,54.9% {opacity:0; transform:translate(0,0)} 55% {opacity:1; transform:translate(0,0)} 56.5% {transform:translate(-75px,-58px)} 58.5% {transform:translate(-185px,-58px)} 60.5% {transform:translate(-260px,0)} 60.5% {opacity:1} 60.6%,100% {opacity:0} }
    /* then the direct WebRTC path opens and carries the file */
    .dline { animation-name: dline } @keyframes dline { 0%,61% {stroke-dashoffset:92; opacity:1} 64%,96% {stroke-dashoffset:0; opacity:1} 100% {stroke-dashoffset:0; opacity:0} }
    .lock  { animation-name: lock } @keyframes lock { 0%,62% {opacity:0; transform:scale(.4)} 64% {opacity:1; transform:scale(1.15)} 65.5%,96% {opacity:1; transform:scale(1)} 100% {opacity:0; transform:scale(1)} }
    .pipe  { animation-name: pipe } @keyframes pipe { 0%,63.9% {opacity:0} 64%,86% {opacity:1} 86.1%,100% {opacity:0} }
    .prog  { animation-name: prog } @keyframes prog { 0%,64% { transform: scaleX(0) } 86%,96% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
    @keyframes flow { 0% {opacity:0; transform:translateX(0)} 12%,88% {opacity:1} 100% {opacity:0; transform:translateX(84px)} }

    .a11 { animation-name: a11 } @keyframes a11 { 0%,10.9% {opacity:0} 11%,96% {opacity:1} 100% {opacity:0} }
    .a14 { animation-name: a14 } @keyframes a14 { 0%,13.9% {opacity:0} 14%,96% {opacity:1} 100% {opacity:0} }
    .a18 { animation-name: a18 } @keyframes a18 { 0%,17.9% {opacity:0} 18%,96% {opacity:1} 100% {opacity:0} }
    .a22 { animation-name: a22 } @keyframes a22 { 0%,21.9% {opacity:0} 22%,96% {opacity:1} 100% {opacity:0} }
    .a26 { animation-name: a26 } @keyframes a26 { 0%,25.9% {opacity:0} 26%,96% {opacity:1} 100% {opacity:0} }
    .a38 { animation-name: a38 } @keyframes a38 { 0%,37.9% {opacity:0} 38%,96% {opacity:1} 100% {opacity:0} }
    .a40 { animation-name: a40 } @keyframes a40 { 0%,39.9% {opacity:0} 40%,96% {opacity:1} 100% {opacity:0} }
    .a43 { animation-name: a43 } @keyframes a43 { 0%,42.9% {opacity:0} 43%,96% {opacity:1} 100% {opacity:0} }
    .a46 { animation-name: a46 } @keyframes a46 { 0%,45.9% {opacity:0} 46%,96% {opacity:1} 100% {opacity:0} }
    .a48 { animation-name: a48 } @keyframes a48 { 0%,47.9% {opacity:0} 48%,96% {opacity:1} 100% {opacity:0} }
    .a61 { animation-name: a61 } @keyframes a61 { 0%,60.9% {opacity:0} 61%,96% {opacity:1} 100% {opacity:0} }
    .a64 { animation-name: a64 } @keyframes a64 { 0%,63.9% {opacity:0} 64%,96% {opacity:1} 100% {opacity:0} }
    .a87 { animation-name: a87 } @keyframes a87 { 0%,86.9% {opacity:0} 87%,96% {opacity:1} 100% {opacity:0} }
    .a89 { animation-name: a89 } @keyframes a89 { 0%,88.9% {opacity:0} 89%,96% {opacity:1} 100% {opacity:0} }
  </style>

  <rect width="920" height="440" rx="14" fill="#14100D"/>

  <!-- signaling through the relay -->
  <line class="sigS" x1="330" y1="120" x2="405" y2="62" stroke="#ECE6DC" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="3 5" fill="none"/>
  <line class="sigR" x1="515" y1="62" x2="590" y2="120" stroke="#ECE6DC" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="3 5" fill="none"/>
  <text class="sigS dim sm" x="350" y="80" text-anchor="end">offer/answer</text>
  <text class="sigR dim sm" x="570" y="80">encrypted</text>
  <circle class="d1" cx="330" cy="120" r="4" fill="#FF4F00"/>
  <circle class="d2" cx="590" cy="120" r="4" fill="#FF4F00"/>
  <rect class="relay" x="385" y="24" width="150" height="44" rx="8" fill="#100D0A" stroke="rgba(236,230,220,.12)" stroke-width="1.2"/>
  <text x="460" y="50" text-anchor="middle" class="acc lbl">RELAY</text>
  <text x="460" y="88" text-anchor="middle" class="dim sm">pairs &#183; never gets key</text>
  <text x="460" y="102" text-anchor="middle" class="dim sm" opacity=".6">fallback: ciphertext only</text>

  <!-- ===== SENDER ===== -->
  <g transform="translate(0 100)">
    <rect x="20" y="20" width="390" height="300" rx="12" fill="#100D0A" stroke="rgba(236,230,220,0.12)"/>
    <circle cx="44" cy="44" r="5" fill="#FF4F00"/><circle cx="60" cy="44" r="5" fill="#221C17"/><circle cx="76" cy="44" r="5" fill="#221C17"/>
    <text x="94" y="48" class="dim">airpipe</text>
    <text x="392" y="48" text-anchor="end" class="acc lbl">SENDER</text>
    <line x1="20" y1="60" x2="410" y2="60" stroke="rgba(236,230,220,0.07)"/>
    <clipPath id="clipS"><rect class="fillbox type-s" x="38" y="72" width="196" height="20"/></clipPath>
    <g clip-path="url(#clipS)">
      <text x="40" y="86"><tspan class="dim">$ </tspan><tspan class="ink">airpipe send demo.zip</tspan><tspan class="caret ink" font-weight="700">&#9608;</tspan></text>
    </g>
    <text x="40" y="112" class="acc a11" font-weight="700">AirPipe &#183; send</text>
    <text x="40" y="134" class="a14"><tspan class="ink">demo.zip</tspan><tspan class="dim">   4.2 MB</tspan></text>
    <g class="a18">
      <rect x="40" y="146" width="300" height="28" rx="6" fill="rgba(255,79,0,0.08)" stroke="#FF4F00"/>
      <text x="54" y="165" class="acc" font-weight="700" letter-spacing="1">RIVER FALCON MARBLE 42</text>
    </g>
    <text x="40" y="196" class="dim a22">Or: airpipe download RIVER FALCON MARBLE 42</text>
    <text x="40" y="218" class="dim a26">Waiting for receiver to join&#8230;</text>
    <text x="40" y="240" class="ok a48">&#10003; Receiver joined</text>
    <g class="a61">
      <rect x="40" y="252" width="320" height="9" rx="4.5" fill="#221C17"/>
      <rect class="fillbox prog" x="40" y="252" width="320" height="9" rx="4.5" fill="#FF4F00"/>
    </g>
    <text x="40" y="292" class="a87"><tspan class="ok">&#10003; Sent </tspan><tspan class="ink">demo.zip</tspan><tspan class="dim">  (4.2 MB)</tspan></text>
  </g>

  <!-- ===== direct path ===== -->
  <line x1="414" y1="270" x2="506" y2="270" stroke="#221C17" stroke-width="3"/>
  <line class="dline" x1="414" y1="270" x2="506" y2="270" stroke="#FF4F00" stroke-width="3" stroke-dasharray="92"/>
  <g class="pipe">
    <circle class="pkt" cx="418" cy="270" r="4" fill="#ECE6DC"/>
    <circle class="pkt" cx="418" cy="270" r="4" fill="#ECE6DC" style="animation-delay:-.33s"/>
    <circle class="pkt" cx="418" cy="270" r="4" fill="#ECE6DC" style="animation-delay:-.66s"/>
  </g>
  <g class="a64">
    <text x="460" y="250" text-anchor="middle" class="ink lbl">WebRTC</text>
    <text x="460" y="302" text-anchor="middle" class="dim sm">E2E &#183; NaCl</text>
  </g>
  <g class="lock ctr">
    <circle cx="460" cy="270" r="13" fill="#14100D" stroke="#FF4F00" stroke-width="1.5"/>
    <path d="M455.5 268v-3a4.5 4.5 0 0 1 9 0v3" fill="none" stroke="#FF4F00" stroke-width="1.6"/>
    <rect x="453" y="268" width="14" height="9" rx="1.5" fill="#FF4F00"/>
  </g>

  <!-- ===== RECEIVER ===== -->
  <g transform="translate(0 100)">
    <rect x="510" y="20" width="390" height="300" rx="12" fill="#100D0A" stroke="rgba(236,230,220,0.12)"/>
    <circle cx="534" cy="44" r="5" fill="#FF4F00"/><circle cx="550" cy="44" r="5" fill="#221C17"/><circle cx="566" cy="44" r="5" fill="#221C17"/>
    <text x="584" y="48" class="dim">airpipe</text>
    <text x="882" y="48" text-anchor="end" class="acc lbl">RECEIVER</text>
    <line x1="510" y1="60" x2="900" y2="60" stroke="rgba(236,230,220,0.07)"/>
    <clipPath id="clipR"><rect class="fillbox type-r" x="528" y="72" width="340" height="20"/></clipPath>
    <g clip-path="url(#clipR)">
      <text x="530" y="86"><tspan class="dim">$ </tspan><tspan class="ink">airpipe download RIVER FALCON MARBLE 42</tspan><tspan class="caret ink" font-weight="700">&#9608;</tspan></text>
    </g>
    <text x="530" y="112" class="acc a38" font-weight="700">AirPipe &#183; download</text>
    <text x="530" y="134" class="a40"><tspan class="dim">Passphrase: </tspan><tspan class="acc">RIVER FALCON MARBLE 42</tspan></text>
    <text x="530" y="156" class="a40"><tspan class="dim">Destination: </tspan><tspan class="ink">.</tspan></text>
    <text x="530" y="196" class="dim a43">Looking up&#8230;</text>
    <text x="530" y="218" class="dim a46">No mailbox transfer; opening direct&#8230;</text>
    <g class="a61">
      <rect x="530" y="252" width="320" height="9" rx="4.5" fill="#221C17"/>
      <rect class="fillbox prog" x="530" y="252" width="320" height="9" rx="4.5" fill="#FF4F00"/>
    </g>
    <text x="530" y="292" class="ok a89">&#10003; Saved: ./demo.zip</text>
  </g>
</svg>
