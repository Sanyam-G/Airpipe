<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" font-family="'JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="AirPipe: the sender runs airpipe send and gets a passphrase; the receiver types it. Both reach the relay only to swap an encrypted WebRTC offer and answer, then the file streams directly between them, encrypted end to end. The relay never gets the key, and if a direct path fails it forwards ciphertext only.">
<style>
text{font-size:13px}.t{font-size:11px;font-weight:600}.caps{letter-spacing:.08em}
.dim{fill:#8D8477}.ink{fill:#ECE6DC}.acc{fill:#FF4F00}.ok{fill:#6FBF73}
.fb{transform-box:fill-box;transform-origin:left center}.fe{transform-box:fill-box;transform-origin:right center}
.ft{transform-box:fill-box;transform-origin:center top}.fbt{transform-box:fill-box;transform-origin:center bottom}.ctr{transform-box:fill-box;transform-origin:center}
/* one shared 15s clock; packets loop at 1s so they stay in phase */
.A{animation:15s linear infinite}
