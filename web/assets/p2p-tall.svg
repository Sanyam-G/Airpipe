<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 520" width="384" height="520" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,monospace" role="img" aria-label="How AirPipe connects: sender and receiver reach the relay only to exchange encrypted signaling, then the file streams directly between them over WebRTC, encrypted end to end. The key stays on the two devices; if a direct path fails, the relay forwards ciphertext.">
  <style>
    text { font-size: 13px; }
    .dim { fill: #8D8477; }
    .ink { fill: #ECE6DC; }
    .acc { fill: #FF4F00; }
    .lbl { font-size: 10px; letter-spacing: 1.5px; font-weight: 700; }
    .sm  { font-size: 11px; }
    .fb  { transform-box: fill-box; transform-origin: center; }

    /* stacked twin of p2p.svg: same 9s clock and timings */
    .sig,.relay,.d1,.d2,.dline,.on,.lock { animation-duration: 9s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .pkt { animation: flow 1s linear infinite; }

    .sig   { animation-name: sig }
    .relay { animation-name: relay }
    .d1    { animation-name: d1 }
    .d2    { animation-name: d2 }
    .dline { animation-name: dline }
    .on    { animation-name: on }
    .lock  { animation-name: lock }

    @keyframes sig   { 0% {opacity:0} 4%,44% {opacity:1} 52%,92% {opacity:.14} 100% {opacity:0} }
    @keyframes relay { 0%,3% {stroke:rgba(236,230,220,.12)} 6%,44% {stroke:#FF4F00} 52%,100% {stroke:rgba(236,230,220,.12)} }
    @keyframes d1 { 0%,6% {opacity:0; transform:translate(0,0)} 7% {opacity:1; transform:translate(0,0)}
                    15% {transform:translate(100px,90px)} 18% {transform:translate(100px,202px)}
                    26% {opacity:1; transform:translate(0,288px)} 27%,100% {opacity:0; transform:translate(0,288px)} }
    @keyframes d2 { 0%,27% {opacity:0; transform:translate(0,0)} 28% {opacity:1; transform:translate(0,0)}
                    35% {transform:translate(100px,-86px)} 38% {transform:translate(100px,-198px)}
                    44% {opacity:1; transform:translate(0,-288px)} 45%,100% {opacity:0; transform:translate(0,-288px)} }
    @keyframes dline { 0%,46% {stroke-dashoffset:288; opacity:1} 54%,92% {stroke-dashoffset:0; opacity:1} 97%,100% {stroke-dashoffset:0; opacity:0} }
    @keyframes on    { 0%,53% {opacity:0} 56%,92% {opacity:1} 97%,100% {opacity:0} }
    @keyframes lock  { 0%,49% {opacity:0; transform:scale(.4)} 53% {opacity:1; transform:scale(1.15)} 56%,92% {opacity:1; transform:scale(1)} 97%,100% {opacity:0; transform:scale(1)} }
    @keyframes flow  { 0% {opacity:0; transform:translateY(0)} 12%,88% {opacity:1} 100% {opacity:0; transform:translateY(272px)} }
  </style>

  <rect width="384" height="520" rx="14" fill="#14100D"/>

  <!-- signaling -->
  <g class="sig" stroke="#ECE6DC" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="3 5" fill="none">
    <line x1="216" y1="116" x2="316" y2="206"/>
    <line x1="316" y1="318" x2="216" y2="404"/>
  </g>
  <g class="sig">
    <text x="284" y="156" class="dim sm">signal</text>
    <text x="284" y="370" class="dim sm">signal</text>
  </g>
  <circle class="d1" cx="216" cy="116" r="4" fill="#FF4F00"/>
  <circle class="d2" cx="216" cy="404" r="4" fill="#FF4F00"/>

  <!-- relay -->
  <rect class="relay" x="262" y="206" width="108" height="112" rx="8" fill="#100D0A" stroke="rgba(236,230,220,.12)" stroke-width="1.2"/>
  <text x="316" y="230" text-anchor="middle" class="acc lbl">RELAY</text>
  <text x="316" y="252" text-anchor="middle" class="dim sm">pairs</text>
  <text x="316" y="268" text-anchor="middle" class="dim sm">never gets key</text>
  <text x="316" y="288" text-anchor="middle" class="dim sm" opacity=".6">fallback:</text>
  <text x="316" y="302" text-anchor="middle" class="dim sm" opacity=".6">ciphertext</text>

  <!-- direct data path -->
  <line x1="60" y1="116" x2="60" y2="404" stroke="#221C17" stroke-width="3"/>
  <line class="dline" x1="60" y1="116" x2="60" y2="404" stroke="#FF4F00" stroke-width="3" stroke-linecap="round" stroke-dasharray="288"/>
  <g class="on">
    <circle class="pkt" cx="60" cy="124" r="4.5" fill="#ECE6DC"/>
    <circle class="pkt" cx="60" cy="124" r="4.5" fill="#ECE6DC" style="animation-delay:-.33s"/>
    <circle class="pkt" cx="60" cy="124" r="4.5" fill="#ECE6DC" style="animation-delay:-.66s"/>
    <text x="84" y="256" class="ink lbl">DIRECT</text>
    <text x="84" y="272" class="ink lbl">WebRTC</text>
    <text x="84" y="290" class="dim sm">E2E · NaCl</text>
  </g>
  <g class="lock fb">
    <circle cx="60" cy="260" r="13" fill="#14100D" stroke="#FF4F00" stroke-width="1.5"/>
    <path d="M55.5 258v-3a4.5 4.5 0 0 1 9 0v3" fill="none" stroke="#FF4F00" stroke-width="1.6"/>
    <rect x="53" y="258" width="14" height="9" rx="1.5" fill="#FF4F00"/>
  </g>

  <!-- sender: terminal -->
  <rect x="16" y="16" width="236" height="100" rx="10" fill="#100D0A" stroke="rgba(236,230,220,.12)"/>
  <circle cx="32" cy="31" r="3.5" fill="#FF4F00"/><circle cx="43" cy="31" r="3.5" fill="#221C17"/><circle cx="54" cy="31" r="3.5" fill="#221C17"/>
  <text x="68" y="35" class="dim sm">terminal</text>
  <text x="240" y="35" text-anchor="end" class="acc lbl">SENDER</text>
  <line x1="16" y1="44" x2="252" y2="44" stroke="rgba(236,230,220,.07)"/>
  <text x="28" y="70" class="sm"><tspan class="dim">$ </tspan><tspan class="ink">airpipe send</tspan></text>
  <text x="28" y="96" class="acc sm" font-weight="700">RIVER FALCON …</text>

  <!-- receiver: phone or browser -->
  <rect x="16" y="404" width="236" height="100" rx="10" fill="#100D0A" stroke="rgba(236,230,220,.12)"/>
  <circle cx="32" cy="419" r="3.5" fill="#FF4F00"/><circle cx="43" cy="419" r="3.5" fill="#221C17"/><circle cx="54" cy="419" r="3.5" fill="#221C17"/>
  <text x="68" y="423" class="dim sm">phone · browser</text>
  <text x="240" y="423" text-anchor="end" class="acc lbl">RECEIVER</text>
  <line x1="16" y1="432" x2="252" y2="432" stroke="rgba(236,230,220,.07)"/>
  <rect x="26" y="442" width="216" height="22" rx="5" fill="#221C17"/>
  <text x="36" y="457" class="sm"><tspan class="dim">/d/3fa9…</tspan><tspan class="acc" font-weight="700">#key</tspan></text>
  <text x="28" y="488" class="dim sm">#key stays local</text>
</svg>
